server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; script-src 'self' https://pagead2.googlesyndication.com 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https://googleads.g.doubleclick.net https://td.doubleclick.net; connect-src 'self' https://api.mymementomori.com https://pagead2.googlesyndication.com; frame-ancestors 'none';" always;

    # Proxy API requests to the backend service (docker-compose only).
    # Using a variable so nginx starts even when 'backend' is not resolvable
    # (e.g. on Render where frontend and backend are separate services).
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy uploaded files to the backend (docker-compose only)
    location /uploads/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve SPA — all non-file routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles (e.g. .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
